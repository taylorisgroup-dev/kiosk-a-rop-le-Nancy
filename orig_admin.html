    function saveData() {
        currentData.general.title = document.getElementById('general.title').value;
        currentData.general.subtitle = document.getElementById('general.subtitle').value;
        currentData.media.topVideoUrl = document.getElementById('media.topVideoUrl').value;
        currentData.media.screensaverVideoUrl = document.getElementById('media.screensaverVideoUrl').value;

        for (const key of Object.keys(currentData.companies)) {
            currentData.companies[key].name = document.getElementById(`comp_${key}_name`).value;
            currentData.companies[key].image = document.getElementById(`comp_${key}_image`).value;
            currentData.companies[key].description = document.getElementById(`comp_${key}_description`).value;
            currentData.companies[key].contact = document.getElementById(`comp_${key}_contact`).value;
            currentData.companies[key].qrUrl = document.getElementById(`comp_${key}_qrUrl`).value;
        }

        fetch('/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(currentData)
        }).then(res => res.json())
          .then(res => {
              if(res.success) {
                  const toast = document.getElementById('toast');
                  toast.style.display = 'block';
                  setTimeout(() => toast.style.display = 'none', 3000);
              }
          });
    }
</script>
